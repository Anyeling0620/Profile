name: Build and Release

# 只负责「构建 + 发布产物」，不负责把产物推到服务器。
# 服务器（国内）反向接收 GitHub 的连接不稳定，所以改成服务器主动拉取：
# 这里把构建结果打成 release-latest 的 Release 资产，服务器侧 timer 每分钟
# 用 ETag 条件请求检查，发现新 commit 才下载并原子替换。
#
# 产物：
#   web-dist.tar.gz  —— vite 构建后的静态站
#   version.json     —— 本次构建的 commit / 产物 sha256，供服务器核对

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 同一分支连续推送时只保留最后一次构建，避免旧提交的产物覆盖新提交
concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write

env:
  ROLLING_RELEASE_TAG: release-latest

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "缺少 dist/index.html"; exit 1; }
          # 防止把空目录或没有资源的构建发布出去
          ls -1 dist
          find dist -name '*.js' | grep -q . || { echo "构建产物里没有 JS"; exit 1; }

      - name: Package artifacts
        run: |
          set -euo pipefail
          tar -czf web-dist.tar.gz -C dist .
          ls -lh web-dist.tar.gz

      - name: Write version.json
        run: |
          set -euo pipefail
          WEB_SHA="$(sha256sum web-dist.tar.gz | awk '{print $1}')"
          cat > version.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "short": "${{ github.sha }}",
            "run": "${{ github.run_number }}",
            "release_tag": "${{ env.ROLLING_RELEASE_TAG }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": {
              "web-dist.tar.gz": { "sha256": "$WEB_SHA", "size": $(stat -c%s web-dist.tar.gz) }
            }
          }
          EOF
          cat version.json

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$ROLLING_RELEASE_TAG"
          notes=$(printf 'commit: %s\nrun: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER")

          # 标签随每次推送移动，让服务器始终看到最新一次成功构建
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" web-dist.tar.gz version.json --clobber
            gh release edit "$tag" --title "$tag" --notes "$notes" --latest
          else
            gh release create "$tag" web-dist.tar.gz version.json \
              --title "$tag" --notes "$notes" --target "$GITHUB_SHA" --latest
          fi

      - name: Summary
        run: |
          {
            echo "### 构建完成"
            echo
            echo "| Release | 文件 | 大小 | sha256 |"
            echo "| --- | --- | --- | --- |"
            echo "| $ROLLING_RELEASE_TAG | web-dist.tar.gz | $(stat -c%s web-dist.tar.gz) | \`$(sha256sum web-dist.tar.gz | awk '{print $1}')\` |"
            echo
            echo "commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
